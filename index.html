
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Bill Flow - Smart Billing & Invoice Management Software</title>

    <meta
      name="description"
      content="Bill Flow is a smart billing and invoice management application that helps businesses manage invoices, track payments, organize customers, and simplify billing operations."
    />

    <meta
      name="keywords"
      content="Bill Flow, billing software, invoice management, invoice generator, business billing, payment tracking, customer management, billing application, SaaS billing software"
    />

    <meta name="author" content="Bill Flow" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Canonical URL: Replace with your actual domain -->
    <link rel="canonical" href="https://yourdomain.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bill Flow - Smart Billing & Invoice Management" />
    <meta
      property="og:description"
      content="Simplify your business billing with Bill Flow. Manage invoices, customers, and payments in one place."
    />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta property="og:site_name" content="Bill Flow" />
    <meta property="og:image" content="https://yourdomain.com/og-image.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bill Flow - Smart Billing Software" />
    <meta
      name="twitter:description"
      content="Manage invoices, customers, and payments easily with Bill Flow."
    />
    <meta name="twitter:image" content="https://yourdomain.com/og-image.png" />

    <!-- Performance -->
    <meta name="format-detection" content="telephone=no" />

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
